<svg width="1168" height="300" viewBox="0 0 1168 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">PTERI identity and authorization flow</title>
  <desc id="heroDesc">A person and an AI agent both connect through PTERI's authorization core, producing a single verified action.</desc>

  <defs>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="glowGreen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <marker id="tick" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
      <circle cx="5" cy="5" r="2.4" fill="context-fill"/>
    </marker>
  </defs>

  <!-- ambient background glow, restrained -->
  <circle cx="584" cy="150" r="170" fill="url(#glowGreen)"/>
  <circle cx="230" cy="150" r="120" fill="url(#glowGreen)"/>
  <circle cx="230" cy="70" r="90" fill="url(#glowIndigo)"/>

  <!-- flow line: person -> core -->
  <path d="M 230 175 C 340 175, 400 160, 470 152" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.55"/>
  <!-- flow line: agent -> core -->
  <path d="M 230 78 C 340 78, 420 110, 470 145" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.55"/>
  <!-- flow line: core -> verified output -->
  <path d="M 700 150 C 800 150, 850 150, 940 150" fill="none" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- traveling particles along the flows -->
  <circle cx="300" cy="172" r="2.6" fill="#34d399"/>
  <circle cx="380" cy="163" r="2" fill="#34d399" opacity="0.7"/>
  <circle cx="300" cy="88" r="2.6" fill="#818cf8"/>
  <circle cx="390" cy="105" r="2" fill="#818cf8" opacity="0.7"/>
  <circle cx="780" cy="150" r="2.6" fill="#34d399"/>
  <circle cx="870" cy="150" r="2" fill="#34d399" opacity="0.7"/>

  <!-- Person node -->
  <g transform="translate(150,150)">
    <circle r="48" fill="#052e22" stroke="#34d399" stroke-width="1.2"/>
    <circle cy="-10" r="12" fill="none" stroke="#a7f3d0" stroke-width="2"/>
    <path d="M -18 20 C -18 2, 18 2, 18 20" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Agent node -->
  <g transform="translate(150,72)">
    <circle r="34" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2"/>
    <rect x="-14" y="-12" width="28" height="20" rx="5" fill="none" stroke="#c7d2fe" stroke-width="2"/>
    <circle cx="-6" cy="-3" r="1.8" fill="#c7d2fe"/>
    <circle cx="6" cy="-3" r="1.8" fill="#c7d2fe"/>
    <line x1="0" y1="-12" x2="0" y2="-19" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-21" r="2.2" fill="#c7d2fe"/>
  </g>

  <!-- PTERI authority core -->
  <g transform="translate(584,150)">
    <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29" fill="url(#coreGrad)" opacity="0.16"/>
    <polygon points="0,-58 50,-29 50,29 0,58 -50,29 -50,-29" fill="none" stroke="#34d399" stroke-width="1.6"/>
    <path d="M -16 -2 L -5 12 L 20 -18" fill="none" stroke="#ecfdf5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Verified action output -->
  <g transform="translate(1000,150)">
    <circle r="46" fill="#052e22" stroke="#34d399" stroke-width="1.2"/>
    <path d="M -16 -2 L -5 11 L 18 -16" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
